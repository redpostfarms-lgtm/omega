<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>OMEGA Drone</title>
    <link rel="manifest" href="manifest-drone.json">
    
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --led-red: #ff0000;
            --drone-color: #ff0000; /* Changes based on drone ID */
        }

        html, body {
            height: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: #ccc;
        }

        body.sipping {
            background: #050505;
        }

        body.sipping .drone-visual {
            opacity: 0.3;
        }

        /* ==========================================
           DRONE VISUAL - Minimal when sipping
           ========================================== */
        .drone-visual {
            text-align: center;
            transition: opacity 0.5s ease;
        }

        .drone-id {
            font-size: 80px;
            font-weight: 200;
            color: var(--drone-color);
            text-shadow: 0 0 30px var(--drone-color);
            margin-bottom: 10px;
        }

        .drone-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #444;
            margin-bottom: 30px;
        }

        /* Status Ring */
        .status-ring {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #222;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            position: relative;
            transition: all 0.3s ease;
        }

        .status-ring::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: var(--drone-color);
            animation: spin 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }

        body.working .status-ring::before {
            opacity: 1;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-ring.connected {
            border-color: var(--drone-color);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }

        .status-ring.sipping {
            border-color: #2a4a2a;
        }

        .status-icon {
            font-size: 40px;
        }

        /* Status Text */
        .status-text {
            font-size: 14px;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .status-text.connected { color: var(--drone-color); }
        .status-text.sipping { color: #3a6a3a; }
        .status-text.working { color: #ffaa00; }

        /* Compute indicator */
        .compute-bar {
            width: 200px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin: 0 auto;
            overflow: hidden;
        }

        .compute-fill {
            height: 100%;
            background: var(--drone-color);
            width: 0%;
            transition: width 0.1s ease;
        }

        body.working .compute-fill {
            animation: compute-pulse 0.5s ease-in-out infinite;
        }

        @keyframes compute-pulse {
            0%, 100% { width: 20%; opacity: 0.5; }
            50% { width: 80%; opacity: 1; }
        }

        /* Connection info */
        .connection-info {
            margin-top: 40px;
            font-size: 10px;
            color: #333;
            text-align: center;
        }

        .queen-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 5px;
        }

        .queen-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #333;
        }

        .queen-dot.connected { background: #ffcc00; }

        /* Wake button (hidden when sipping) */
        .wake-btn {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 10px 25px;
            color: #444;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
        }

        .wake-btn:hover {
            border-color: var(--drone-color);
            color: var(--drone-color);
        }

        body.sipping .wake-btn {
            opacity: 0.3;
        }

        /* Dark mode indicator */
        .sip-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #222;
            transition: all 0.3s;
        }

        body.sipping .sip-indicator {
            background: #2a5a2a;
            box-shadow: 0 0 10px #3a7a3a;
        }

        /* Drone colors */
        body[data-drone="1"] { --drone-color: #333333; }
        body[data-drone="2"] { --drone-color: #0088ff; }
        body[data-drone="3"] { --drone-color: #ff0000; }
        body[data-drone="4"] { --drone-color: #ffffff; }

        body[data-drone="1"] .drone-id { color: #666; text-shadow: 0 0 20px #333; }
    </style>
</head>
<body data-drone="1">
    <div class="sip-indicator"></div>

    <div class="drone-visual">
        <div class="drone-id" id="droneId">1</div>
        <div class="drone-label">Drone</div>

        <div class="status-ring" id="statusRing">
            <div class="status-icon" id="statusIcon">📡</div>
        </div>

        <div class="status-text" id="statusText">Connecting...</div>

        <div class="compute-bar">
            <div class="compute-fill" id="computeFill"></div>
        </div>

        <div class="connection-info">
            <div class="queen-status">
                <div class="queen-dot" id="queenDot"></div>
                <span id="queenStatus">Queen: Searching...</span>
            </div>
            <div id="lastCommand">Awaiting orders</div>
        </div>
    </div>

    <button class="wake-btn" id="wakeBtn">Wake</button>

    <script>
        // ============================================
        // OMEGA DRONE - Background Worker
        // ============================================

        const Drone = {
            // Config from URL params
            id: 1,
            queenUrl: null,
            computePercent: 20,

            // State
            status: 'connecting', // connecting, connected, sipping, working, offline
            channel: null,
            isScreenOff: false,
            wakeLock: null,

            // Elements
            el: {},

            init() {
                this.parseParams();
                this.cacheElements();
                this.applyDroneColor();
                this.initSwarmConnection();
                this.initVisibilityDetection();
                this.initEvents();
                this.initWakeLock();

                console.log(`[DRONE ${this.id}] Initialized`);
            },

            parseParams() {
                const params = new URLSearchParams(location.search);
                this.id = parseInt(params.get('id')) || 1;
                this.queenUrl = params.get('queen') || null;
                document.body.dataset.drone = this.id;
            },

            cacheElements() {
                this.el = {
                    droneId: document.getElementById('droneId'),
                    statusRing: document.getElementById('statusRing'),
                    statusIcon: document.getElementById('statusIcon'),
                    statusText: document.getElementById('statusText'),
                    computeFill: document.getElementById('computeFill'),
                    queenDot: document.getElementById('queenDot'),
                    queenStatus: document.getElementById('queenStatus'),
                    lastCommand: document.getElementById('lastCommand'),
                    wakeBtn: document.getElementById('wakeBtn')
                };
                this.el.droneId.textContent = this.id;
            },

            applyDroneColor() {
                const colors = {
                    1: '#333333', // Black
                    2: '#0088ff', // Blue
                    3: '#ff0000', // Red
                    4: '#ffffff'  // White
                };
                document.documentElement.style.setProperty('--drone-color', colors[this.id] || '#ff0000');
            },

            // ==========================================
            // SWARM CONNECTION
            // ==========================================

            initSwarmConnection() {
                // BroadcastChannel for same-device
                if ('BroadcastChannel' in window) {
                    this.channel = new BroadcastChannel('omega-swarm');
                    this.channel.onmessage = (e) => this.handleQueenMessage(e.data);
                    
                    // Announce ourselves
                    this.announceOnline();
                }

                // Heartbeat
                setInterval(() => this.sendHeartbeat(), 5000);
            },

            announceOnline() {
                this.broadcast({
                    type: 'drone-online',
                    id: this.id,
                    status: this.status
                });
                this.updateStatus('connected');
            },

            broadcast(msg) {
                if (this.channel) {
                    this.channel.postMessage(msg);
                }
            },

            sendHeartbeat() {
                this.broadcast({
                    type: 'drone-status',
                    id: this.id,
                    status: this.status,
                    compute: this.computePercent
                });
            },

            handleQueenMessage(msg) {
                switch (msg.type) {
                    case 'queen-online':
                    case 'queen-ping':
                        this.el.queenDot.classList.add('connected');
                        this.el.queenStatus.textContent = 'Queen: Online';
                        if (this.status === 'connecting') {
                            this.updateStatus('connected');
                        }
                        break;

                    case 'process-query':
                        this.processQuery(msg.query);
                        break;

                    case 'queen-offline':
                        this.el.queenDot.classList.remove('connected');
                        this.el.queenStatus.textContent = 'Queen: Offline';
                        break;
                }
            },

            // ==========================================
            // COMPUTE PROCESSING
            // ==========================================

            async processQuery(query) {
                this.updateStatus('working');
                this.el.lastCommand.textContent = `Processing: "${query.substring(0, 30)}..."`;

                // Simulate processing (in real app, this would be actual compute)
                const startTime = Date.now();
                
                // Simulate work with varying duration
                const workDuration = 500 + Math.random() * 1000;
                await this.simulateWork(workDuration);

                // Send result back
                this.broadcast({
                    type: 'compute-result',
                    droneId: this.id,
                    query: query,
                    result: `Processed by Drone ${this.id}`,
                    duration: Date.now() - startTime
                });

                // Return to previous state
                this.updateStatus(this.isScreenOff ? 'sipping' : 'connected');
                this.el.lastCommand.textContent = 'Task complete';
            },

            simulateWork(duration) {
                return new Promise(resolve => {
                    const startTime = Date.now();
                    const animate = () => {
                        const elapsed = Date.now() - startTime;
                        const progress = Math.min(100, (elapsed / duration) * 100);
                        this.el.computeFill.style.width = progress + '%';
                        
                        if (elapsed < duration) {
                            requestAnimationFrame(animate);
                        } else {
                            this.el.computeFill.style.width = '0%';
                            resolve();
                        }
                    };
                    animate();
                });
            },

            // ==========================================
            // VISIBILITY / SCREEN DETECTION
            // ==========================================

            initVisibilityDetection() {
                // Page visibility
                document.addEventListener('visibilitychange', () => {
                    this.isScreenOff = document.hidden;
                    this.onVisibilityChange();
                });

                // Screen wake lock API
                if ('wakeLock' in navigator) {
                    this.initWakeLock();
                }

                // Initial state
                this.isScreenOff = document.hidden;
                if (this.isScreenOff) {
                    this.updateStatus('sipping');
                }
            },

            onVisibilityChange() {
                if (this.isScreenOff) {
                    // Screen off = sipping mode (donate compute silently)
                    this.updateStatus('sipping');
                    document.body.classList.add('sipping');
                    console.log(`[DRONE ${this.id}] Entering sip mode`);
                } else {
                    // Screen on = awake
                    this.updateStatus('connected');
                    document.body.classList.remove('sipping');
                    console.log(`[DRONE ${this.id}] Awake`);
                }

                this.sendHeartbeat();
            },

            async initWakeLock() {
                // Keep screen awake when working (optional)
                try {
                    if ('wakeLock' in navigator) {
                        document.addEventListener('visibilitychange', async () => {
                            if (!document.hidden && this.status === 'working') {
                                this.wakeLock = await navigator.wakeLock.request('screen');
                            }
                        });
                    }
                } catch (e) {
                    console.log('Wake lock not available');
                }
            },

            // ==========================================
            // STATUS UPDATES
            // ==========================================

            updateStatus(status) {
                this.status = status;
                
                // Update UI
                this.el.statusRing.className = 'status-ring ' + status;
                this.el.statusText.className = 'status-text ' + status;
                document.body.classList.remove('working');

                const statusMap = {
                    connecting: { icon: '📡', text: 'Connecting...' },
                    connected: { icon: '✓', text: 'Connected' },
                    sipping: { icon: '🌙', text: 'Sipping' },
                    working: { icon: '⚡', text: 'Processing' },
                    offline: { icon: '✕', text: 'Offline' }
                };

                const s = statusMap[status] || statusMap.offline;
                this.el.statusIcon.textContent = s.icon;
                this.el.statusText.textContent = s.text;

                if (status === 'working') {
                    document.body.classList.add('working');
                }

                // Broadcast status change
                this.sendHeartbeat();
            },

            // ==========================================
            // EVENTS
            // ==========================================

            initEvents() {
                this.el.wakeBtn.addEventListener('click', () => {
                    if (this.status === 'sipping') {
                        this.updateStatus('connected');
                        document.body.classList.remove('sipping');
                    }
                });

                // Tap to show status
                document.body.addEventListener('click', (e) => {
                    if (e.target === document.body || e.target.closest('.drone-visual')) {
                        this.showStatus();
                    }
                });
            },

            showStatus() {
                const info = `Drone ${this.id} | ${this.status} | ${this.computePercent}% compute`;
                this.el.lastCommand.textContent = info;
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => Drone.init());

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
