[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "gatekeeper-omega"
version = "1.0.0"
description = "Advanced AI Assistant with Voice, Agents, Security, and Predictive Analytics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "The Gatekeeper Project", email = "gatekeeper@example.com"}
]
keywords = ["ai", "voice", "tts", "agents", "monitoring", "security", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
]

dependencies = [
    # Core Voice & TTS
    "torch>=2.0.0,<2.6.0",
    "TTS>=0.22.0",
    "speechbrain>=0.5.16",
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
    "SpeechRecognition>=3.10.0",

    # Audio Processing
    "librosa>=0.10.0",
    "pyaudio>=0.2.13",

    # LLM & AI
    "ollama>=0.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "accelerate>=0.25.0",

    # Monitoring & Metrics
    "prometheus-client>=0.19.0",
    "psutil>=5.9.0",

    # Storage & Utilities
    "pyyaml>=6.0",
    "schedule>=1.2.0",

    # Web & API
    "flask>=3.0.0",
    "waitress>=2.1.2",
    "aiohttp>=3.9.0",

    # Notifications
    "win10toast>=0.9",
    "jinja2>=3.1.2",

    # Data Processing
    "numpy>=1.24.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
# Advanced features for 98% completion
advanced = [
    "prophet>=1.1.5",
    "scikit-learn>=1.4.0",
    "statsmodels>=0.14.1",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-community>=0.0.10",
    "langchain-core>=0.1.0",
    "python-telegram-bot>=20.7",
    "discord.py>=2.3.2",
    "slack-sdk>=3.26.0",
    "grafana-client>=3.5.0",
    "elasticsearch>=8.11.0",
]

# Development dependencies
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
]

# Performance monitoring
monitoring = [
    "py-spy>=0.3.14",
    "memory-profiler>=0.61.0",
    "locust>=2.20.0",
]

# Production deployment
production = [
    "redis>=5.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "gunicorn>=21.2.0",
]

# All optional features
all = [
    "gatekeeper-omega[advanced,dev,monitoring,production]",
]

[project.urls]
Homepage = "https://github.com/gatekeeper-project/gatekeeper-omega"
Documentation = "https://gatekeeper-omega.readthedocs.io"
Repository = "https://github.com/gatekeeper-project/gatekeeper-omega"
Issues = "https://github.com/gatekeeper-project/gatekeeper-omega/issues"

[project.scripts]
gatekeeper = "gatekeeper.cli:main"
omega-voice = "gatekeeper.omega_full_brain:main"
omega-web-ide = "gatekeeper.omega_web_ide:main"
omega-health = "gatekeeper.omega_predictive_health:main"

[tool.hatchling.build.targets.wheel]
packages = ["."]

[tool.hatchling.build.targets.sdist]
include = [
    "/*.py",
    "/utils/*.py",
    "/tests/*.py",
    "/config/*.json",
    "/config/*.yaml",
    "/notification_templates/*.html",
    "/dashboards/*.json",
    "requirements*.txt",
    "*.md",
    "LICENSE",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".git",
    ".github",
    "*.egg-info",
    "dist",
    "build",
    ".pytest_cache",
    ".coverage",
    "htmlcov",
    ".env",
    "omega_voice/",
    "conversations/",
    "logs/",
    "pretrained_*",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | pretrained_emotion
  | omega_voice
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/*.py" = ["F401", "F811"]  # unused imports, redefinition

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "requires_gpu: marks tests that require GPU",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/pretrained_*/*",
    "*/omega_voice/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "TTS.*",
    "speechbrain.*",
    "prophet.*",
    "torch.*",
]
ignore_missing_imports = true
