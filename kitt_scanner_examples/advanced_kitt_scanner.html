<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITT Voice Box Scanner - Advanced with Audio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Orbitron', 'Courier New', monospace;
            overflow: hidden;
        }

        .dashboard {
            width: 90%;
            max-width: 900px;
            padding: 40px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0000 100%);
            border: 3px solid #ff0000;
            border-radius: 20px;
            box-shadow:
                0 0 50px rgba(255, 0, 0, 0.5),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 3em;
            color: #ff0000;
            text-shadow:
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 30px #ff0000;
            letter-spacing: 8px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .subtitle {
            color: #888;
            margin-top: 10px;
            font-size: 0.9em;
            letter-spacing: 3px;
        }

        /* Main Scanner */
        .scanner-container {
            position: relative;
            margin: 30px 0;
        }

        .kitt-scanner {
            width: 100%;
            height: 60px;
            background: linear-gradient(180deg, #0a0000 0%, #1a0000 50%, #0a0000 100%);
            border: 3px solid #330000;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(255, 0, 0, 0.6),
                inset 0 0 30px rgba(0, 0, 0, 0.9);
        }

        /* Animated Glow Background */
        .glow-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.1) 0%, transparent 70%);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* Canvas for smooth animation */
        #scannerCanvas {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Status Display */
        .status-bar {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 0, 0, 0.05);
            border: 1px solid #330000;
            border-radius: 10px;
        }

        .status-item {
            text-align: center;
        }

        .status-label {
            color: #888;
            font-size: 0.8em;
            margin-bottom: 5px;
        }

        .status-value {
            color: #ff0000;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 0 0 5px #ff0000;
        }

        /* Control Panel */
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .control-group {
            background: rgba(255, 0, 0, 0.05);
            padding: 15px;
            border: 1px solid #330000;
            border-radius: 10px;
        }

        .control-label {
            color: #ff0000;
            font-size: 0.9em;
            margin-bottom: 10px;
            display: block;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #1a0000 0%, #330000 100%);
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 12px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        button:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.active {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #330000;
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #ff0000;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
        }

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            background: #ff0000;
            cursor: pointer;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
        }

        select {
            width: 100%;
            padding: 8px;
            background: #1a0000;
            color: #ff0000;
            border: 2px solid #330000;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
        }

        .value-display {
            color: #ff0000;
            text-align: center;
            margin-top: 5px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <div class="header">
            <h1 class="title">K.I.T.T.</h1>
            <p class="subtitle">Knight Industries Two Thousand</p>
        </div>

        <div class="scanner-container">
            <div class="kitt-scanner">
                <div class="glow-overlay"></div>
                <canvas id="scannerCanvas"></canvas>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-label">STATUS</div>
                <div class="status-value" id="statusText">STANDBY</div>
            </div>
            <div class="status-item">
                <div class="status-label">SCAN RATE</div>
                <div class="status-value" id="scanRate">0 Hz</div>
            </div>
            <div class="status-item">
                <div class="status-label">PATTERN</div>
                <div class="status-value" id="patternName">CLASSIC</div>
            </div>
        </div>

        <div class="control-panel">
            <div class="control-group">
                <label class="control-label">Power Control</label>
                <button id="powerBtn" onclick="togglePower()">ACTIVATE</button>
            </div>

            <div class="control-group">
                <label class="control-label">Speed: <span id="speedValue">50</span>%</label>
                <input type="range" id="speedControl" min="10" max="100" value="50">
                <div class="value-display"><span id="speedMs">50</span>ms</div>
            </div>

            <div class="control-group">
                <label class="control-label">Trail Length: <span id="trailValue">8</span></label>
                <input type="range" id="trailControl" min="3" max="20" value="8">
            </div>

            <div class="control-group">
                <label class="control-label">Pattern Mode</label>
                <select id="patternSelect">
                    <option value="classic">Classic Bounce</option>
                    <option value="sweep">Single Sweep</option>
                    <option value="dual">Dual Scanner</option>
                    <option value="center">Center Out</option>
                    <option value="random">Random Pulse</option>
                </select>
            </div>

            <div class="control-group">
                <label class="control-label">Intensity: <span id="intensityValue">100</span>%</label>
                <input type="range" id="intensityControl" min="30" max="100" value="100">
            </div>

            <div class="control-group">
                <label class="control-label">Color Scheme</label>
                <select id="colorSelect">
                    <option value="red">Classic Red</option>
                    <option value="blue">Cool Blue</option>
                    <option value="green">Matrix Green</option>
                    <option value="purple">Purple Haze</option>
                    <option value="orange">Amber Alert</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        // Canvas Setup
        const canvas = document.getElementById('scannerCanvas');
        const ctx = canvas.getContext('2d');

        // Configuration
        let config = {
            speed: 50,
            trailLength: 8,
            intensity: 100,
            pattern: 'classic',
            color: 'red',
            isActive: false
        };

        // Animation State
        let position = 0;
        let position2 = 0;
        let direction = 1;
        let direction2 = -1;
        let animationFrame = null;
        let lastTime = 0;

        // Color Schemes
        const colorSchemes = {
            red: ['#ff0000', '#cc0000', '#990000', '#660000', '#330000'],
            blue: ['#00ffff', '#00cccc', '#009999', '#006666', '#003333'],
            green: ['#00ff00', '#00cc00', '#009900', '#006600', '#003300'],
            purple: ['#ff00ff', '#cc00cc', '#990099', '#660066', '#330033'],
            orange: ['#ff6600', '#cc5200', '#993d00', '#662900', '#331400']
        };

        // Resize canvas to match container
        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }

        // Get current color scheme
        function getColors() {
            return colorSchemes[config.color];
        }

        // Draw scanner
        function draw(timestamp) {
            if (!config.isActive) return;

            // Calculate delta time
            const deltaTime = timestamp - lastTime;
            if (deltaTime < config.speed) {
                animationFrame = requestAnimationFrame(draw);
                return;
            }
            lastTime = timestamp;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update scan rate display
            const scanRate = (1000 / config.speed).toFixed(1);
            document.getElementById('scanRate').textContent = scanRate + ' Hz';

            // Draw based on pattern
            switch (config.pattern) {
                case 'classic':
                    drawClassicPattern();
                    break;
                case 'sweep':
                    drawSweepPattern();
                    break;
                case 'dual':
                    drawDualPattern();
                    break;
                case 'center':
                    drawCenterPattern();
                    break;
                case 'random':
                    drawRandomPattern();
                    break;
            }

            animationFrame = requestAnimationFrame(draw);
        }

        // Classic bouncing pattern
        function drawClassicPattern() {
            const colors = getColors();
            const normalizedPos = position / 100;
            const x = normalizedPos * canvas.width;

            for (let i = 0; i < config.trailLength; i++) {
                const trailPos = position - (i * direction * 2);
                if (trailPos >= 0 && trailPos <= 100) {
                    const trailX = (trailPos / 100) * canvas.width;
                    const colorIndex = Math.min(i, colors.length - 1);
                    const alpha = ((config.intensity / 100) * (1 - i / config.trailLength)).toFixed(2);

                    drawLED(trailX, colors[colorIndex], alpha);
                }
            }

            position += direction * 2;
            if (position >= 100) {
                position = 100;
                direction = -1;
            } else if (position <= 0) {
                position = 0;
                direction = 1;
            }
        }

        // Sweep pattern (continuous one direction)
        function drawSweepPattern() {
            const colors = getColors();
            const normalizedPos = position / 100;
            const x = normalizedPos * canvas.width;

            for (let i = 0; i < config.trailLength; i++) {
                const trailPos = position - (i * 2);
                if (trailPos >= 0 && trailPos <= 100) {
                    const trailX = (trailPos / 100) * canvas.width;
                    const colorIndex = Math.min(i, colors.length - 1);
                    const alpha = ((config.intensity / 100) * (1 - i / config.trailLength)).toFixed(2);

                    drawLED(trailX, colors[colorIndex], alpha);
                }
            }

            position += 2;
            if (position >= 100) {
                position = 0;
            }
        }

        // Dual scanner pattern
        function drawDualPattern() {
            const colors = getColors();

            // First scanner
            for (let i = 0; i < config.trailLength; i++) {
                const trailPos = position - (i * direction * 2);
                if (trailPos >= 0 && trailPos <= 100) {
                    const trailX = (trailPos / 100) * canvas.width;
                    const colorIndex = Math.min(i, colors.length - 1);
                    const alpha = ((config.intensity / 100) * (1 - i / config.trailLength)).toFixed(2);
                    drawLED(trailX, colors[colorIndex], alpha);
                }
            }

            // Second scanner
            for (let i = 0; i < config.trailLength; i++) {
                const trailPos = position2 - (i * direction2 * 2);
                if (trailPos >= 0 && trailPos <= 100) {
                    const trailX = (trailPos / 100) * canvas.width;
                    const colorIndex = Math.min(i, colors.length - 1);
                    const alpha = ((config.intensity / 100) * (1 - i / config.trailLength)).toFixed(2);
                    drawLED(trailX, colors[colorIndex], alpha);
                }
            }

            position += direction * 2;
            position2 += direction2 * 2;

            if (position >= 100) {
                position = 100;
                direction = -1;
            } else if (position <= 0) {
                position = 0;
                direction = 1;
            }

            if (position2 >= 100) {
                position2 = 100;
                direction2 = -1;
            } else if (position2 <= 0) {
                position2 = 0;
                direction2 = 1;
            }
        }

        // Center out pattern
        function drawCenterPattern() {
            const colors = getColors();
            const center = 50;

            for (let i = 0; i < config.trailLength; i++) {
                const offset = position + (i * 2);

                // Left side
                const leftPos = center - offset;
                if (leftPos >= 0) {
                    const leftX = (leftPos / 100) * canvas.width;
                    const colorIndex = Math.min(i, colors.length - 1);
                    const alpha = ((config.intensity / 100) * (1 - i / config.trailLength)).toFixed(2);
                    drawLED(leftX, colors[colorIndex], alpha);
                }

                // Right side
                const rightPos = center + offset;
                if (rightPos <= 100) {
                    const rightX = (rightPos / 100) * canvas.width;
                    const colorIndex = Math.min(i, colors.length - 1);
                    const alpha = ((config.intensity / 100) * (1 - i / config.trailLength)).toFixed(2);
                    drawLED(rightX, colors[colorIndex], alpha);
                }
            }

            position += 2;
            if (position >= 50) {
                position = 0;
            }
        }

        // Random pulse pattern
        function drawRandomPattern() {
            const colors = getColors();
            const numPulses = 5;

            for (let p = 0; p < numPulses; p++) {
                const pulsePos = ((position + p * 20) % 100);
                const pulseX = (pulsePos / 100) * canvas.width;

                for (let i = 0; i < 3; i++) {
                    const colorIndex = Math.min(i, colors.length - 1);
                    const alpha = ((config.intensity / 100) * (1 - i / 3) * 0.7).toFixed(2);
                    drawLED(pulseX, colors[colorIndex], alpha);
                }
            }

            position = (position + 3) % 100;
        }

        // Draw a single LED
        function drawLED(x, color, alpha) {
            const y = canvas.height / 2;
            const radius = 15;

            // Outer glow
            const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius * 2);
            gradient.addColorStop(0, color + alpha);
            gradient.addColorStop(0.5, color + Math.min(alpha * 0.5, 0.5).toFixed(2));
            gradient.addColorStop(1, 'transparent');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(x, y, radius * 2, 0, Math.PI * 2);
            ctx.fill();

            // Core
            ctx.fillStyle = color;
            ctx.globalAlpha = alpha;
            ctx.beginPath();
            ctx.arc(x, y, radius / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
        }

        // Control Functions
        function togglePower() {
            config.isActive = !config.isActive;
            const btn = document.getElementById('powerBtn');
            const status = document.getElementById('statusText');

            if (config.isActive) {
                btn.textContent = 'DEACTIVATE';
                btn.classList.add('active');
                status.textContent = 'ACTIVE';
                lastTime = performance.now();
                animationFrame = requestAnimationFrame(draw);
            } else {
                btn.textContent = 'ACTIVATE';
                btn.classList.remove('active');
                status.textContent = 'STANDBY';
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                document.getElementById('scanRate').textContent = '0 Hz';
            }
        }

        // Event Listeners
        document.getElementById('speedControl').addEventListener('input', function (e) {
            const value = parseInt(e.target.value);
            config.speed = 110 - value; // Inverse for intuitive control
            document.getElementById('speedValue').textContent = value;
            document.getElementById('speedMs').textContent = config.speed;
        });

        document.getElementById('trailControl').addEventListener('input', function (e) {
            config.trailLength = parseInt(e.target.value);
            document.getElementById('trailValue').textContent = config.trailLength;
        });

        document.getElementById('intensityControl').addEventListener('input', function (e) {
            config.intensity = parseInt(e.target.value);
            document.getElementById('intensityValue').textContent = config.intensity;
        });

        document.getElementById('patternSelect').addEventListener('change', function (e) {
            config.pattern = e.target.value;
            position = 0;
            position2 = 100;
            direction = 1;
            direction2 = -1;

            const patternNames = {
                'classic': 'CLASSIC',
                'sweep': 'SWEEP',
                'dual': 'DUAL',
                'center': 'CENTER',
                'random': 'RANDOM'
            };
            document.getElementById('patternName').textContent = patternNames[config.pattern];
        });

        document.getElementById('colorSelect').addEventListener('change', function (e) {
            config.color = e.target.value;
        });

        // Initialize
        window.addEventListener('load', () => {
            resizeCanvas();
            togglePower(); // Auto-start
        });

        window.addEventListener('resize', resizeCanvas);
    </script>
</body>

</html>
