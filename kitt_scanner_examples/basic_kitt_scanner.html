<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITT Voice Box Scanner - Basic</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 50px;
            font-size: 2em;
        }

        /* KITT Scanner Container */
        .kitt-scanner {
            width: 600px;
            height: 40px;
            background: #1a0000;
            border: 2px solid #330000;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 20px rgba(255, 0, 0, 0.5),
                inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        /* LED Bars */
        .led-bar {
            position: absolute;
            top: 0;
            height: 100%;
            display: flex;
            gap: 4px;
            padding: 5px;
        }

        .led {
            width: 8px;
            height: 30px;
            background: #330000;
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        /* Active LED states */
        .led.active-5 {
            background: #ff0000;
            box-shadow:
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 30px #ff0000;
        }

        .led.active-4 {
            background: #cc0000;
            box-shadow: 0 0 8px #cc0000;
        }

        .led.active-3 {
            background: #990000;
            box-shadow: 0 0 6px #990000;
        }

        .led.active-2 {
            background: #660000;
            box-shadow: 0 0 4px #660000;
        }

        .led.active-1 {
            background: #440000;
        }

        /* Controls */
        .controls {
            margin-top: 30px;
        }

        button {
            background: #330000;
            color: #ff0000;
            border: 2px solid #ff0000;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #ff0000;
            color: #000;
            box-shadow: 0 0 10px #ff0000;
        }

        button:active {
            transform: scale(0.95);
        }

        .speed-control {
            margin-top: 20px;
            color: #ff0000;
        }

        input[type="range"] {
            width: 200px;
            margin: 0 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>KITT VOICE BOX SCANNER</h1>

        <div class="kitt-scanner" id="scanner">
            <div class="led-bar" id="ledBar"></div>
        </div>

        <div class="controls">
            <button onclick="startScanner()">START</button>
            <button onclick="stopScanner()">STOP</button>
            <button onclick="resetScanner()">RESET</button>
        </div>

        <div class="speed-control">
            <label for="speedControl">Speed:</label>
            <input type="range" id="speedControl" min="10" max="100" value="50" title="Animation speed control">
            <span id="speedValue">50ms</span>
        </div>
    </div>

    <script>
        // Configuration
        const NUM_LEDS = 60;
        const TRAIL_LENGTH = 5;
        let animationSpeed = 50;
        let position = 0;
        let direction = 1;
        let animationInterval = null;
        let isRunning = false;

        // Initialize LEDs
        function initializeLEDs() {
            const ledBar = document.getElementById('ledBar');
            ledBar.innerHTML = '';

            for (let i = 0; i < NUM_LEDS; i++) {
                const led = document.createElement('div');
                led.className = 'led';
                led.id = `led-${i}`;
                ledBar.appendChild(led);
            }
        }

        // Update LED states
        function updateLEDs() {
            // Clear all LEDs
            for (let i = 0; i < NUM_LEDS; i++) {
                const led = document.getElementById(`led-${i}`);
                led.className = 'led';
            }

            // Set active LEDs with trail effect
            for (let i = 0; i < TRAIL_LENGTH; i++) {
                const ledIndex = position - (i * direction);
                if (ledIndex >= 0 && ledIndex < NUM_LEDS) {
                    const led = document.getElementById(`led-${ledIndex}`);
                    const intensity = TRAIL_LENGTH - i;
                    led.classList.add(`active-${intensity}`);
                }
            }
        }

        // Animation loop
        function animate() {
            updateLEDs();

            position += direction;

            // Bounce at edges
            if (position >= NUM_LEDS - 1) {
                position = NUM_LEDS - 1;
                direction = -1;
            } else if (position <= 0) {
                position = 0;
                direction = 1;
            }
        }

        // Control functions
        function startScanner() {
            if (!isRunning) {
                isRunning = true;
                animationInterval = setInterval(animate, animationSpeed);
            }
        }

        function stopScanner() {
            if (isRunning) {
                isRunning = false;
                clearInterval(animationInterval);
            }
        }

        function resetScanner() {
            stopScanner();
            position = 0;
            direction = 1;
            updateLEDs();
        }

        // Speed control
        document.getElementById('speedControl').addEventListener('input', function (e) {
            animationSpeed = parseInt(e.target.value);
            document.getElementById('speedValue').textContent = animationSpeed + 'ms';

            if (isRunning) {
                stopScanner();
                startScanner();
            }
        });

        // Initialize on load
        window.onload = function () {
            initializeLEDs();
            updateLEDs();
            startScanner(); // Auto-start
        };
    </script>
</body>

</html>
